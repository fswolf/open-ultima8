[workspace]
resolver = "2"
# Layering (each crate only depends on the ones above it):
#   u8data   – file formats
#   u8engine – game state and rules (world, actors, usecode VM)
#   u8render – pixels (sprites, upscaling, painter's sort, text)
#   u8view / u8tool – the apps; u8cmp – the test harness (headless play, random walks)
members = ["crates/u8data", "crates/u8engine", "crates/u8render", "crates/u8tool", "crates/u8view", "crates/u8cmp"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.dev.package."*"]
opt-level = 2
